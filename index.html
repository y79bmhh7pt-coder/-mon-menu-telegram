<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Menu</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f2f2f2;
    }

    h1 {
      text-align: center;
    }

    .produit {
      background: white;
      padding: 15px;
      margin: 12px 0;
      border-radius: 15px;
    }

    .produit h2 {
      margin: 0 0 5px;
    }

    .prix {
      font-weight: bold;
      margin-bottom: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      font-size: 16px;
      background: #0088cc;
      color: white;
    }

    #panier {
      margin-top: 25px;
      background: white;
      padding: 15px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <h1>🍔 MON MENU</h1>

  <div class="produit">
    <h2>🍔 Burger</h2>
    <div class="prix">8,00 €</div>
    <button onclick="ajouter('Burger', 8)">Ajouter</button>
  </div>

  <div class="produit">
    <h2>🍕 Pizza</h2>
    <div class="prix">10,00 €</div>
    <button onclick="ajouter('Pizza', 10)">Ajouter</button>
  </div>

  <div class="produit">
    <h2>🍟 Frites</h2>
    <div class="prix">3,00 €</div>
    <button onclick="ajouter('Frites', 3)">Ajouter</button>
  </div>

  <div id="panier">
    <h2>🛒 Mon panier</h2>
    <div id="contenu">Panier vide</div>
    <h3 id="total">Total : 0,00 €</h3>
  </div>

  <script>
    const panier = [];

    function ajouter(nom, prix) {
      panier.push({nom: nom, prix: prix});
      afficherPanier();
    }

    function afficherPanier() {
      let texte = "";
      let total = 0;

      panier.forEach(function(article) {
        texte += "• " + article.nom + " — " + article.prix.toFixed(2) + " €<br>";
        total += article.prix;
      });

      document.getElementById("contenu").innerHTML =
        texte || "Panier vide";

      document.getElementById("total").innerHTML =
        "Total : " + total.toFixed(2) + " €";
    }
  </script>

</body>
</html>
